<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09843B">
  <meta name="robots" content="noindex">
  <title>Activity Rotation – Teachers</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2309843B'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="dash-header">
    <img class="logo" src="unisimon-logo-50-year.png" alt="Universidad Simón Bolívar">
    <div class="dash-user" id="user-box" hidden>
      <span id="user-email"></span>
      <button class="btn btn-secondary btn-small" id="btn-logout" type="button">Sign out</button>
    </div>
  </header>

  <!-- Loading -->
  <div class="loading" id="v-loading"><div class="spinner spinner-dark"></div><span>Loading…</span></div>

  <!-- Login -->
  <main class="login" id="v-login" hidden>
    <h1 class="event-title"><span data-event-title>Activity Rotation</span></h1>
    <p class="lead center" style="margin-top:6px">Teacher dashboard</p>
    <form id="login-form" class="card" style="margin-top:24px" novalidate>
      <div class="alert alert-error" id="login-error" role="alert" hidden>
        <span class="alert-icon">!</span><div id="login-error-text"></div>
      </div>
      <div class="field">
        <label for="l-email">Email</label>
        <input class="input" id="l-email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="l-password">Password</label>
        <input class="input" id="l-password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </main>

  <!-- Dashboard -->
  <main class="dash" id="v-dash" hidden>
    <h1 class="dash-title"><span data-event-title>Activity Rotation</span> · My students</h1>
    <p class="activity-info" id="teacher-info" style="margin:6px 0 0"></p>
    <p class="dash-sub" id="last-update"></p>

    <div class="alert alert-error" id="dash-error" role="alert" style="margin-top:16px" hidden>
      <span class="alert-icon">!</span><div id="dash-error-text"></div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <div class="filters">
        <div class="field">
          <label for="search">Search student</label>
          <input class="input" id="search" type="search" placeholder="Name or student ID">
        </div>
        <label class="check"><input type="checkbox" id="only-incomplete"> Show only students who haven't finished</label>
      </div>
      <div class="toolbar-actions">
        <button class="btn btn-secondary btn-small" id="btn-refresh" type="button">↻ Refresh</button>
        <button class="btn btn-small" id="btn-download" type="button">⬇ Download PDF</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="students-head"></thead>
        <tbody id="students-rows"></tbody>
      </table>
    </div>

    <!-- Coordinator only: single-use sign-up links for teachers -->
    <section class="invites" id="invites" hidden>
      <div>
        <h2 class="section-title">Invite teachers</h2>
        <p class="muted">Send each teacher their own link. It works only once: after the teacher creates their account, the link stops working.</p>
      </div>
      <form class="invite-form" id="invite-form" novalidate>
        <div class="field">
          <label for="invite-note">Who is it for? <span class="muted" style="font-weight:normal">(optional)</span></label>
          <input class="input" id="invite-note" maxlength="80" placeholder="e.g. Laura Martínez">
        </div>
        <button class="btn btn-small" type="submit">＋ New invitation link</button>
      </form>
      <div class="alert alert-error" id="invite-error" role="alert" hidden>
        <span class="alert-icon">!</span><div id="invite-error-text"></div>
      </div>
      <div class="invite-list" id="invite-rows"></div>
    </section>
  </main>

  <footer class="site-footer" data-footer></footer>

  <!-- PDF download options -->
  <div class="modal" id="pdf-modal" role="dialog" aria-modal="true" aria-labelledby="pdf-title" hidden>
    <form class="modal-card" id="pdf-form">
      <h2 id="pdf-title">Download PDF report</h2>
      <p class="muted" style="margin-top:-6px" id="pdf-desc"></p>

      <label class="check" style="min-height:auto" id="pdf-photos-label"><input type="checkbox" id="pdf-photos" checked> <span id="pdf-photos-text">Include photo thumbnails</span></label>

      <div class="alert alert-error" id="pdf-error" role="alert" hidden>
        <span class="alert-icon">!</span><div id="pdf-error-text"></div>
      </div>
      <p class="muted" id="pdf-status" role="status"></p>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="pdf-cancel" type="button">Cancel</button>
        <button class="btn" id="pdf-submit" type="submit">⬇ Download PDF</button>
      </div>
    </form>
  </div>

  <!-- Photo viewer -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="close" id="lightbox-close" type="button" aria-label="Close">×</button>
    <figure>
      <img id="lightbox-img" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="teachers.js"></script>
</body>
</html>
