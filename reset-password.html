<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09843B">
  <meta name="robots" content="noindex">
  <title>Activity Rotation – New password</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2309843B'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
  <header class="site-header">
    <img class="logo" src="unisimon-logo-50-year.png" alt="Universidad Simón Bolívar">
  </header>

  <main class="container">
    <h1 class="event-title" data-event-title>Activity Rotation</h1>

    <section class="screen" id="s-loading">
      <div class="loading"><div class="spinner spinner-dark"></div><span>Loading…</span></div>
    </section>

    <!-- Link not valid, used or expired -->
    <section class="screen" id="s-invalid" hidden>
      <div class="alert alert-error" role="alert">
        <span class="alert-icon">!</span>
        <div><strong id="invalid-title">This link isn't valid</strong> <span id="invalid-text"></span></div>
      </div>
      <button class="btn btn-secondary" id="invalid-retry" type="button" hidden>Try again</button>
      <a class="btn" href="teachers.html">Go to sign in</a>
    </section>

    <!-- New password -->
    <section class="screen" id="s-form" hidden>
      <div>
        <h2>Choose a new password</h2>
        <p class="lead" style="margin-top:6px" id="form-who"></p>
      </div>
      <div class="alert alert-error" id="form-error" role="alert" hidden>
        <span class="alert-icon">!</span><div id="form-error-text"></div>
      </div>
      <form id="reset-form" novalidate>
        <div class="field">
          <label for="r-password">New password</label>
          <input class="input" id="r-password" type="password" autocomplete="new-password" required minlength="8">
          <span class="hint">At least 8 characters.</span>
        </div>
        <div class="field">
          <label for="r-password2">Repeat password</label>
          <input class="input" id="r-password2" type="password" autocomplete="new-password" required minlength="8">
        </div>
        <button class="btn" type="submit">Save new password</button>
      </form>
    </section>

    <!-- Done -->
    <section class="screen" id="s-done" hidden>
      <div class="card center">
        <div class="big-check" aria-hidden="true">✓</div>
        <h2 style="margin-top:14px">Password changed!</h2>
        <p class="lead" style="margin-top:6px" id="done-text"></p>
      </div>
      <a class="btn" href="teachers.html">Sign in to my dashboard</a>
    </section>
  </main>

  <footer class="site-footer" data-footer></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=12"></script>
  <script src="common.js?v=12"></script>
  <script src="reset-password.js?v=12"></script>
</body>
</html>
